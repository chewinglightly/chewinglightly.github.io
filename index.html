    <!-- ======================================================================
  HOW TO CUSTOMISE THE COLLAGE
  Each piece is positioned with numbers in its style="" attribute:
    --x  left (0-100)   --y  top (0-132)   --w  width   --tilt  rotation   --z  layer
  • Swap a photo: change src="".
  • Change a photo's shape: change the class (blob-a, blob-b, star, heart,
    circle, arch).
  • Add a doodle: copy a doodle line and change the numbers or the #d-... id.
====================================================================== -->

    <main class="collage">
      <!-- Title (styled in style.css, section 4) -->
      <!-- <h1 class="title outline-text">
    <span>Chewing</span>
    <span>Lightly</span>
    <small>✦ 2026 ✦</small>
  </h1> -->
      <div
        style="
          width: 100%;
          display: flex;
          justify-content: center;
          align-items: center;
        "
      >
        <div class="title outline-text">
          <img
            src="images/title.png"
            alt="Chewing Lightly logo"
            loading="lazy"
          />
        </div>
      </div>

      <!-- BACKGROUND LINE PATTERNS ================================== -->
      <!-- <div class="piece backdrop grid"     style="--x:0;  --y:0;  --w:100; --h:132; --z:0" aria-hidden="true"></div> -->

      <!-- <div class="piece backdrop halftone" style="--x:48; --y:38; --w:62;  --h:62;  --z:1" aria-hidden="true"></div> -->

      <!-- Faded duplicate photo behind the title -->

        style="--x: 36; --y: 40; --w: 30; --z: 1; --tilt: 2deg"
        aria-hidden="true"
      >
        <img src="images/sunflowerEarrings.png" alt="" loading="lazy" />
      </div>

      <svg
        class="piece doodle"
        style="--x: 1; --y: 40; --w: 36; --z: 2"
        viewBox="0 0 100 100"
        aria-hidden="true"
      >
        <use href="#d-ring" />
      </svg>

      <!-- PHOTOS ==================================================== -->
      <figure

        style="--x: 7; --y: 29; --w: 38; --tilt: -4deg; --z: 3"
